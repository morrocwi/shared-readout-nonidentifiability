name: Verify

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect formal artifact
        id: detect
        shell: bash
        run: |
          if [[ -s CoreTheorem.v ]] || compgen -G '.import/CoreTheorem.v.b64.*' > /dev/null; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct staged artifact
        if: ${{ steps.detect.outputs.present == 'true' && hashFiles('.import/CoreTheorem.v.b64.*') != '' }}
        run: |
          mkdir -p paper
          cat .import/CoreTheorem.v.b64.* | base64 --decode > CoreTheorem.v
          cat .import/main.tex.b64.* | base64 --decode > paper/main.tex
          test -s CoreTheorem.v
          test -s paper/main.tex

      - name: Verify formal development with Rocq 9.2
        if: ${{ steps.detect.outputs.present == 'true' }}
        run: |
          chmod -R a+rwX "$GITHUB_WORKSPACE"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            rocq/rocq-prover:9.2 \
            rocq compile -q CoreTheorem.v
          ! grep -nE '^[[:space:]]*(Axiom|Parameter|Conjecture|Admitted)([[:space:]]|\.)' CoreTheorem.v

      - name: Install TeX dependencies
        if: ${{ steps.detect.outputs.present == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk poppler-utils texlive-latex-base texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra

      - name: Build and inspect paper
        if: ${{ steps.detect.outputs.present == 'true' }}
        run: |
          make paper
          test -s paper/main.pdf
          pdfinfo paper/main.pdf | grep -q '^Pages:'

      - name: Replace staging chunks with canonical files
        if: ${{ github.event_name == 'push' && steps.detect.outputs.present == 'true' && hashFiles('.import/CoreTheorem.v.b64.*') != '' }}
        run: |
          rm -rf .import
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import formal artifact and compiled paper [skip ci]"
          git push
